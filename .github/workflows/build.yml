name: Build DocEncryptor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =====================
  # WINDOWS
  # =====================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows application
        run: |
          pyinstaller --onefile --windowed --name DocEncryptor app.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-Windows
          path: dist/DocEncryptor.exe


  # =====================
  # MACOS INTEL
  # =====================
  build-macos-intel:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Intel macOS application
        run: |
          pyinstaller --windowed --name DocEncryptor app.py

      - name: Upload Intel macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-macOS-Intel
          path: dist/DocEncryptor.app


  # =====================
  # MACOS APPLE SILICON
  # =====================
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Apple Silicon macOS application
        run: |
          pyinstaller --windowed --name DocEncryptor app.py

      - name: Upload Apple Silicon macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-macOS-Apple-Silicon
          path: dist/DocEncryptor.app
