name: Build DocEncryptor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =====================
  # WINDOWS
  # =====================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows application
        run: |
          pyinstaller --onefile --windowed --name DocEncryptor app.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-Windows
          path: dist/DocEncryptor.exe


  # =====================
  # MACOS INTEL
  # =====================
  build-macos-intel:
    runs-on: macos-13-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Intel macOS application
        run: |
          pyinstaller \
          --onefile \
          --windowed \
          --target-architecture x86_64 \
          --name DocEncryptor \
          --osx-bundle-identifier com.cdog67890.docencryptor \
          app.py

      - name: Verify application signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/DocEncryptor.app || true

      - name: Upload Intel macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-macOS-Intel
          path: dist/DocEncryptor.app


  # =====================
  # MACOS APPLE SILICON
  # =====================
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Apple Silicon macOS application
        run: |
          pyinstaller \
          --windowed \
          --target-architecture arm64 \
          --name DocEncryptor \
          --osx-bundle-identifier com.cdog67890.docencryptor \
          app.py

      - name: Upload Apple Silicon macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DocEncryptor-macOS-Apple-Silicon
          path: dist/DocEncryptor.app


  # =====================
  # LINUX
  # =====================
  jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --clean --onefile --name SecureFileEncryptor --add-data "assets/secure_file.png:assets" app.py

      - name: Compress Binary
        run: |
          cd dist
          tar -czvf SecureFileEncryptor-linux-x86_64.tar.gz SecureFileEncryptor

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SecureFileEncryptor-linux-x86_64.tar.gz
